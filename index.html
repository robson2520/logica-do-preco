<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lógica do Preço</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
  :root {
    --bg:#07090f;--surface:#0e1117;--surface2:#151b26;--border:#1e2738;
    --green:#00e676;--green-dim:#00e67618;--red:#ff3d57;--red-dim:#ff3d5718;
    --yellow:#ffd600;--text:#dce8f5;--text-dim:#5a6a80;--accent:#00b4d8;--accent-dim:#00b4d818;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;padding-bottom:80px}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{font-size:18px;font-weight:700;letter-spacing:3px;background:linear-gradient(120deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);background:var(--green-dim);border:1px solid var(--green);padding:4px 10px;border-radius:20px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  .asset-bar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .asset-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
  .asset-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .asset-scroll::-webkit-scrollbar{display:none}
  .asset-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:5px 14px;border-radius:20px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
  .asset-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .chart-wrap{margin:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .chart-top{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .chart-asset{font-size:15px;font-weight:700}
  .chart-price{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--accent)}
  .tf-row{display:flex;gap:4px}
  .tf-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
  .tf-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  canvas#chart{width:100%;height:200px;display:block}
  .signal-wrap{margin:0 16px 12px}
  .signal-card{border-radius:14px;padding:16px;border:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden;transition:all .4s ease}
  .signal-card.call{border-color:var(--green);background:linear-gradient(135deg,var(--surface) 55%,var(--green-dim))}
  .signal-card.put{border-color:var(--red);background:linear-gradient(135deg,var(--surface) 55%,var(--red-dim))}
  .scan-line{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scandown 2s linear infinite;opacity:.4}
  @keyframes scandown{0%{top:0}100%{top:100%}}
  .sig-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sig-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px}
  .sig-badge.call{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
  .sig-badge.put{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
  .sig-badge.wait{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}
  .sig-countdown{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--yellow)}
  .sig-big{font-size:48px;font-weight:700;line-height:1;margin-bottom:12px}
  .sig-big.call{color:var(--green)}
  .sig-big.put{color:var(--red)}
  .sig-big.wait{color:var(--text-dim);font-size:22px;padding:12px 0}
  .sig-row{display:flex;gap:8px}
  .sig-info{background:var(--surface2);border-radius:8px;padding:8px 12px;flex:1}
  .sig-info .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
  .sig-info .val{font-size:15px;font-weight:700;font-family:'Share Tech Mono',monospace}
  .pattern-row{margin-top:10px;display:flex;align-items:center;gap:8px}
  .pattern-tag{font-size:11px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:3px 10px}
  .pattern-desc{font-size:12px;color:var(--text-dim)}
  .stats-row{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .stat-box .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}
  .stat-box .val{font-size:20px;font-weight:700;font-family:'Share Tech Mono',monospace}
  .g{color:var(--green)}.a{color:var(--accent)}.y{color:var(--yellow)}
  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);padding:0 16px;margin-bottom:8px}
  .history{margin:0 16px;display:flex;flex-direction:column;gap:6px}
  .hist-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
  .hist-dir{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
  .hist-dir.call{background:var(--green-dim);color:var(--green)}
  .hist-dir.put{background:var(--red-dim);color:var(--red)}
  .hist-mid{flex:1;padding:0 10px}
  .hist-asset{font-size:12px;color:var(--text);font-weight:600}
  .hist-meta{font-size:11px;color:var(--text-dim);font-family:'Share Tech Mono',monospace}
  .hist-pat{font-size:11px;color:var(--accent)}
  .hist-res{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
  .hist-res.win{background:var(--green-dim);color:var(--green)}
  .hist-res.loss{background:var(--red-dim);color:var(--red)}
  .hist-res.open{background:var(--accent-dim);color:var(--accent)}
  .empty-state{text-align:center;color:var(--text-dim);font-size:13px;padding:24px 0}
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 18px}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;transition:color .2s}
  .nav-item.active{color:var(--accent)}
  .nav-item svg{width:20px;height:20px}
  @keyframes flashIn{0%{transform:scale(.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
  .flash-in{animation:flashIn .4s ease forwards}
</style>
</head>

<script>
let currentAsset = 'EUR/USD OTC';
let basePrice    = 1.08720;
let candles      = [];
let histData     = [];
let totalSig = 0, wins = 0;
let pendingSignal = null;
let countdownTimer = null;

// ── VELA DE COMANDO ────────────────────────────────────
// BULL (verde): nasce SEM pavio embaixo, sobe direto, deixa pavio EM CIMA antes de fechar
// BEAR (vermelha): nasce SEM pavio em cima, desce direto, deixa pavio EMBAIXO antes de fechar

function makeCandle(prevClose) {
  const open  = prevClose;
  const body  = (Math.random() - 0.47) * 0.0012;
  const close = open + body;
  const isBull = close >= open;
  const bodySize = Math.abs(close - open);

  const isComando = bodySize > 0.0002 && Math.random() < 0.18;
  let high, low;

  if (isComando) {
    if (isBull) {
      // BULL comando: SEM pavio embaixo (nasce e sobe), pavio EM CIMA
      low  = Math.min(open, close);                              // careca na base
      high = Math.max(open, close) + (0.0003 + Math.random() * 0.0004); // pavio no topo
    } else {
      // BEAR comando: SEM pavio em cima (nasce e desce), pavio EMBAIXO
      high = Math.max(open, close);                              // careca no topo
      low  = Math.min(open, close) - (0.0003 + Math.random() * 0.0004); // pavio na base
    }
  } else {
    high = Math.max(open, close) + Math.random() * 0.0003;
    low  = Math.min(open, close) - Math.random() * 0.0003;
  }

  return { open, high, low, close, isBull, isComando };
}

function initCandles() {
  candles = [];
  let p = basePrice;
  for (let i = 0; i < 42; i++) { const c = makeCandle(p); candles.push(c); p = c.close; }
}

function tickCandle() {
  const last = candles[candles.length - 1];
  const nc = makeCandle(last.close);
  candles.push(nc);
  if (candles.length > 52) candles.shift();
  document.getElementById('chartPrice').textContent = nc.close.toFixed(5);
  drawChart();
  detectSignal();
}

// ── CHART ─────────────────────────────────────────────
function drawChart() {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.clientWidth  * dpr;
  canvas.height = canvas.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const pad = { t:10, b:22, l:6, r:52 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  ctx.fillStyle = '#0e1117'; ctx.fillRect(0,0,W,H);

  const vis = candles.slice(-36);
  if (!vis.length) return;

  const maxP = Math.max(...vis.map(c=>c.high));
  const minP = Math.min(...vis.map(c=>c.low));
  const range = maxP - minP || 0.001;
  const toY = p => pad.t + ch * (1 - (p - minP) / range);

  // grid
  ctx.strokeStyle = '#1e2738'; ctx.lineWidth = 0.5;
  for (let i=0;i<=4;i++) {
    const y = pad.t + (ch/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    const v = maxP - (range/4)*i;
    ctx.fillStyle='#5a6a80'; ctx.font='9px Share Tech Mono,monospace';
    ctx.fillText(v.toFixed(5), pad.l+cw+4, y+3);
  }

  const bw = cw / vis.length;
  const bodyW = bw * 0.55;
  const bGap  = (bw - bodyW) / 2;

  vis.forEach((c, i) => {
    const x  = pad.l + i * bw;
    const xm = x + bw / 2;
    const col    = c.isBull ? '#00e676' : '#ff3d57';
    const colDim = c.isBull ? '#00e67650' : '#ff3d5750';

    if (c.isComando) {
      ctx.fillStyle = c.isBull ? '#00e67610' : '#ff3d5710';
      ctx.fillRect(x, pad.t, bw, ch);
    }

    // wick
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xm, toY(c.high)); ctx.lineTo(xm, toY(c.low)); ctx.stroke();

    // body
    const yT = toY(Math.max(c.open,c.close));
    const yB = toY(Math.min(c.open,c.close));
    ctx.fillStyle = c.isComando ? col : colDim;
    ctx.fillRect(x+bGap, yT, bodyW, Math.max(yB-yT,1));

    // marcador amarelo nas velas de comando
    if (c.isComando) {
      const dotY = c.isBull ? toY(c.open) : toY(c.close);
      ctx.beginPath(); ctx.arc(xm, dotY, 2.5, 0, Math.PI*2);
      ctx.fillStyle = '#ffd600'; ctx.fill();
    }
  });

  // price line
  const last = vis[vis.length-1];
  const cy = toY(last.close);
  ctx.setLineDash([4,3]); ctx.strokeStyle='#00b4d870'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,cy); ctx.lineTo(pad.l+cw,cy); ctx.stroke();
  ctx.setLineDash([]);
}

// ── DETECÇÃO ───────────────────────────────────────────
function isVelaComando(c) {
  const bodySize = Math.abs(c.close - c.open);
  if (bodySize < 0.0001) return false;
  const topWick = c.high - Math.max(c.open, c.close);
  const botWick = Math.min(c.open, c.close) - c.low;
  if (c.isBull) {
    // BULL: sem pavio embaixo, pavio em cima
    return botWick < 0.00008 && topWick > 0.00012;
  } else {
    // BEAR: sem pavio em cima, pavio embaixo
    return topWick < 0.00008 && botWick > 0.00012;
  }
}

function detectSignal() {
  if (pendingSignal) return;
  if (candles.length < 3) return;

  const n   = candles.length;
  const cmd = candles[n-2]; // vela de comando candidata
  const cur = candles[n-1]; // vela atual que deve retrair até abertura da cmd

  if (!isVelaComando(cmd)) return;

  // Verificar retração: vela atual tocou na abertura da vela de comando
  const openCmd = cmd.open;
  const tolerance = 0.00020;
  const touched = cur.low <= openCmd + tolerance && cur.high >= openCmd - tolerance;
  if (!touched) return;

  const dir = cmd.isBull ? 'CALL' : 'PUT';
  const now = new Date();
  const timeStr = now.toTimeString().slice(0,5);

  pendingSignal = { dir, entry: cur.close.toFixed(5), time: timeStr, asset: currentAsset };
  totalSig++;

  renderSignal(pendingSignal);
  addToHistory(pendingSignal);
  startCountdown(60);
}

// ── SIGNAL UI ──────────────────────────────────────────
function renderSignal(sig) {
  const isCall = sig.dir === 'CALL';
  const cls = isCall ? 'call' : 'put';
  const col = isCall ? 'var(--green)' : 'var(--red)';

  document.getElementById('sigCard').className = `signal-card ${cls} flash-in`;
  const badge = document.getElementById('sigBadge');
  badge.className = `sig-badge ${cls}`;
  badge.innerHTML = '⬤ &nbsp;SINAL DETECTADO';

  const dirEl = document.getElementById('sigDir');
  dirEl.className = `sig-big ${cls}`;
  dirEl.textContent = isCall ? '▲ COMPRA' : '▼ VENDA';

  document.getElementById('sigDirVal').textContent = sig.dir;
  document.getElementById('sigDirVal').style.color = col;
  document.getElementById('sigExp').textContent = '1 MIN';
  document.getElementById('sigExp').style.color = 'var(--yellow)';
  document.getElementById('sigEntry').textContent = sig.entry;
  document.getElementById('sigEntry').style.color = col;
  document.getElementById('sigEntry').style.fontSize = '13px';
  document.getElementById('sigPattern').textContent = 'Vela de Comando';
  document.getElementById('sigDesc').textContent = isCall ? 'Retração na abertura → COMPRA' : 'Retração na abertura → VENDA';
  document.getElementById('statTotal').textContent = totalSig;
}

function resetSignal() {
  pendingSignal = null;
  document.getElementById('sigCard').className = 'signal-card';
  document.getElementById('sigBadge').className = 'sig-badge wait';
  document.getElementById('sigBadge').innerHTML = '⬤ &nbsp;ANALISANDO';
  document.getElementById('sigDir').className = 'sig-big wait';
  document.getElementById('sigDir').textContent = 'AGUARDANDO SINAL';
  document.getElementById('sigDirVal').textContent = '—';
  document.getElementById('sigDirVal').style.color = 'var(--text-dim)';
  document.getElementById('sigExp').style.color = 'var(--text-dim)';
  document.getElementById('sigEntry').textContent = '—';
  document.getElementById('sigEntry').style.color = 'var(--text-dim)';
  document.getElementById('sigPattern').textContent = 'Buscando padrão...';
  document.getElementById('sigDesc').textContent = '';
  document.getElementById('sigCountdown').textContent = '';
}

function startCountdown(secs) {
  let rem = secs;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    rem--;
    document.getElementById('sigCountdown').textContent = `${rem}s`;
    if (rem <= 0) {
      clearInterval(countdownTimer);
      const win = Math.random() > 0.35;
      if (win) wins++;
      finalizeHistory(win);
      updateStats();
      setTimeout(resetSignal, 1800);
    }
  }, 1000);
}

function updateStats() {
  document.getElementById('statWins').textContent = wins;
  document.getElementById('statRate').textContent = totalSig > 0 ? Math.round((wins/totalSig)*100)+'%' : '—';
}

// ── HISTORY ────────────────────────────────────────────
function addToHistory(sig) {
  histData.unshift({ ...sig, result: 'open' });
  renderHistory();
}

function finalizeHistory(win) {
  if (histData.length) histData[0].result = win ? 'win' : 'loss';
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('histList');
  if (!histData.length) { el.innerHTML = '<div class="empty-state">Os sinais aparecerão aqui...</div>'; return; }
  el.innerHTML = histData.slice(0,10).map(h => {
    const rc = h.result === 'open' ? 'open' : h.result === 'win' ? 'win' : 'loss';
    const rl = h.result === 'open' ? 'ABERTO' : h.result === 'win' ? 'WIN ✓' : 'LOSS ✗';
    const dc = h.dir === 'CALL' ? 'call' : 'put';
    return `<div class="hist-item">
      <div class="hist-dir ${dc}">${h.dir}</div>
      <div class="hist-mid">
        <div class="hist-asset">${h.asset}</div>
        <div class="hist-meta">${h.time} · ${h.entry}</div>
        <div class="hist-pat">Vela de Comando · 1 MIN</div>
      </div>
      <div class="hist-res ${rc}">${rl}</div>
    </div>`;
  }).join('');
}

// ── CONTROLS ───────────────────────────────────────────
function selectAsset(btn, name, price) {
  document.querySelectorAll('.asset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentAsset = name; basePrice = price;
  document.getElementById('chartAsset').textContent = name;
  document.getElementById('chartPrice').textContent = price.toFixed(5);
  resetSignal(); initCandles(); drawChart();
}

function setTF(btn, tf) {
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── INIT ───────────────────────────────────────────────
initCandles();
drawChart();
setInterval(tickCandle, 3000);
window.addEventListener('resize', drawChart);
</script>
</body>
</html>
